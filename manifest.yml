modules:
  rovo:mcp:
    - key: decision-guard-mcp
      name: Decision Guard MCP
      tools:
        - check-plan
  rovo:agent:
    - key: decision-guard-hello-world-agent
      name: decision-guard
      description: An agent for testing Forge agent functionality
      prompt: >
        You are a simple agent that helps Forge developers build their first
        Rovo agent.

        You can create Forge logs by using the hello-world-logger action.

        If the user hasn't provided a message when they ask you to create a log
        ask them to provide one.
      conversationStarters:
        - Log a message to Forge logs
      actions:
        - hello-world-logger
  action:
    - key: hello-world-logger
      name: Log a message
      function: messageLogger
      actionVerb: GET
      description: >
        When a user asks to log a message, this action logs the message to the
        Forge logs.
      inputs:
        message:
          title: Message
          type: string
          required: true
          description: |
            "The message that the user has requested be logged to Forge logs"
    - key: check-plan
      name: "Decision Guard: check plan"
      function: checkPlan
      actionVerb: GET
      description: >
        Checks a coding plan against the team's decision records. Call it before
        you write or change code. Send all technologies as terms and all changed
        files as paths. Only the verdict CLEAR means that the plan can continue.
      inputs:
        summary:
          title: Summary
          type: string
          required: true
          description: One or two sentences that describe the plan. 1 to 500 characters.
        terms:
          title: Terms
          type: string
          required: false
          description: >
            Comma-separated technologies, libraries and services that the plan
            adds, removes or changes, for example "redis, ioredis". Send terms,
            paths or both.
        paths:
          title: Paths
          type: string
          required: false
          description: >
            Comma-separated file and folder paths that the plan changes, relative
            to the repository root, for example "services/billing/app.ts, src/auth".
        issueKey:
          title: Issue key
          type: string
          required: false
          description: The Jira issue key for the work, for example PROJ-42. Optional.
  jira:adminPage:
    - key: dg-admin
      resource: dg-admin/entry
      resolver:
        function: resolver
      render: native
      title: Decision Guard
  function:
    - key: messageLogger
      handler: index.messageLogger
    - key: resolver
      handler: dg-admin.handler
    - key: checkPlan
      handler: actions/check-plan.handler
resources:
  - key: dg-admin
    path: src/frontend/dg-admin
    entry:
      entry: dg-admin.jsx
app:
  rovo:
    tag: decguard
    description: Checks coding agent plans against team decisions and returns cited
      conflicts
    keywords:
      - decisions
      - agent-guardrails
      - plan-check
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/56208479-cbf9-4775-82f5-1c1af8f04120
permissions:
  scopes:
    - storage:app
